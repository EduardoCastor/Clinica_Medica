<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>MedSync SaaS - Redirecionando...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Suporte a case-sensitivity e caminhos híbridos (GitHub Pages e Vercel)
      var l = window.location;
      var path = l.pathname;
      var isClinicaMedica = path.toLowerCase().indexOf('/clinica_medica') === 0;

      if (isClinicaMedica) {
        // Normaliza automaticamente qualquer variação de maiúsculas/minúsculas para /clinica_medica/
        var subpath = path.slice('/clinica_medica'.length);
        var cleanSubpath = subpath ? subpath.replace(/^\//, '').replace(/&/g, '~and~') : '';
        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/clinica_medica/' + (cleanSubpath ? '?/' + cleanSubpath : '') +
          (l.search ? (cleanSubpath ? '&' : '?') + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(targetUrl);
      } else {
        // Redirecionamento para raiz (Vercel ou domínio próprio)
        var cleanPath = path.slice(1).replace(/&/g, '~and~');
        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/?/' + cleanPath +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(targetUrl);
      }
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #64748b;">
      Redirecionando para o MedSync SaaS...
    </p>
  </body>
</html>
