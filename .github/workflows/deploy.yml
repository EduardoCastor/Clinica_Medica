name: Deploy MedSync to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas uma implantação simultânea, cancelando compilações antigas
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Aplicação (Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Compilar para produção (Vite Build)
        run: npm run build
        env:
          BUILD_TARGET: 'github'
          VITE_BASE_PATH: '/clinica_medica/'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato compilado (pasta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar artefato compilado
        id: deployment
        uses: actions/deploy-pages@v4
